
<div class="container">
  <div class="card">
    <h1>App Partituras IBVG</h1>

    <p>Nosso primeiro aplicativo está funcionando!</p>

    <input
      type="text"
      placeholder="Digite alguma coisa..."
      #texto
    />

    <button (click)="mensagem = texto.value">
      Enviar
    </button>

    <p class="resultado" *ngIf="mensagem">
      Você escreveu: {{ mensagem }}
    </p>
  </div>
</div>
